    <script>
        (function () {
            var dateKey = 'guildDate_v11';
            var cacheKey = 'guildGlobal_v11';
            var PAGE_ID = 'taowayi-guild-v2';
            var INC_URL = 'https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=' + PAGE_ID;
            var GET_URL = 'https://hits.seeyoufarm.com/api/count/get/badge.svg?url=' + PAGE_ID;

            var today = (function () {
                var now = new Date();
                return now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');
            })();

            var totalEl = document.getElementById('visitor-total');
            var todayEl  = document.getElementById('visitor-today');
            var statusEl = document.getElementById('visitor-status');
            var rarityEl = document.getElementById('visitor-rarity');
            var levelEl  = document.getElementById('visitor-level');
            var expFillEl = document.getElementById('visitor-exp-fill');
            var expLevelEl = document.getElementById('visitor-exp-level');

            if (!totalEl || !todayEl || !statusEl || !rarityEl || !levelEl || !expFillEl || !expLevelEl) return;

            function parseCount(svg) {
                var m = svg.match(/<text[^>]*>\s*(\d+)\s*<\/text>/);
                return m ? parseInt(m[1], 10) : null;
            }

            function updateRPG(v) {
                v = v || 1;
                var epl = 50, lv = Math.floor(v / epl) + 1, exp = v % epl;
                var ranks = ['见习术士','青铜冒险者','白银探索者','黄金讨伐者','秘银旅人','传说勇者'];
                var rank = ranks[Math.min(ranks.length - 1, Math.floor((lv - 1) / 3))];
                var circumference = 100.5;
                rarityEl.textContent = v >= 500 ? 'SSR' : v >= 100 ? 'SR' : 'R';
                levelEl.innerHTML = rank + ' Lv.' + String(lv).padStart(2, '0');
                expFillEl.setAttribute('stroke-dashoffset', circumference - (exp / epl * circumference));
                expLevelEl.textContent = 'Lv.' + String(lv).padStart(2, '0');
            }

            function fetchCount(url, cb) {
                fetch(url, { cache: 'no-store' })
                    .then(function (r) { return r.text(); })
                    .then(function (svg) { cb(null, parseCount(svg)); })
                    .catch(function (e) { cb(e); });
            }

            try {
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var k = localStorage.key(i);
                    if (k && (k.indexOf('visitorBadge') !== -1 || k.indexOf('guild') !== -1)) localStorage.removeItem(k);
                }

                // count.getloli.com 图只管显示
                totalEl.src = 'https://count.getloli.com/get/@Taowayi-guild-v2?theme=asoul&v=' + today;

                var storedDate = localStorage.getItem(dateKey);
                var firstVisitToday = storedDate !== today;

                if (!firstVisitToday) {
                    var cached = parseInt(localStorage.getItem(cacheKey) || '0', 10);
                    if (cached > 0) {
                        updateRPG(cached);
                        todayEl.textContent = '待命中';
                        statusEl.textContent = '待命中';
                        return;
                    }
                }

                localStorage.setItem(dateKey, today);
                var url = firstVisitToday ? INC_URL : GET_URL;

                fetchCount(url, function (err, globalCount) {
                    statusEl.textContent = err ? '单人探索' : (firstVisitToday ? '报到完了' : '待命中');
                    todayEl.textContent = firstVisitToday ? '委托达成' : '待命中';
                    if (!err && globalCount) {
                        localStorage.setItem(cacheKey, String(globalCount));
                        updateRPG(globalCount);
                    } else {
                        var fb = parseInt(localStorage.getItem(cacheKey) || '1', 10);
                        updateRPG(fb || 1);
                    }
                });
            } catch (e) {
                var fb = parseInt(localStorage.getItem(cacheKey) || '1', 10);
                if (!Number.isFinite(fb) || fb < 0) fb = 1;
                updateRPG(fb);
                statusEl.textContent = '单人探索';
                todayEl.textContent = '--';
            }
        })();
    </script>
